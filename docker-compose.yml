services:
  mysql:
    image: mysql:8.0
    container_name: taller_mysql
    environment:
      MYSQL_DATABASE: taller_mecanico
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taller_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=taller_mecanico
      - DB_USERNAME=root
      - DB_PASSWORD=

volumes:
  mysql_data:
